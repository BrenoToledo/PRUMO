name: CI

# Economia de minutos: roda só no PR pronto (não em rascunho) e no merge na main,
# ignora mudanças só de documentação/design e cancela execuções antigas do mesmo PR.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "design/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prumo
          POSTGRES_PASSWORD: prumo
          POSTGRES_DB: prumo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prumo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://prumo:prumo@localhost:5432/prumo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
