<li id="item-{{ item.pk }}" class="item item--aviso" data-some-em="6000">
  <p>Item descartado.</p>
  <form method="post" action="{% url 'web:restaurar' item.pk %}"
        hx-post="{% url 'web:restaurar' item.pk %}" hx-target="#item-{{ item.pk }}" hx-swap="outerHTML">
    {% csrf_token %}
    <button class="botao botao--pequeno" type="submit">Desfazer</button>
  </form>
</li>
