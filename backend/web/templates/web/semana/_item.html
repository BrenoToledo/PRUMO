{# Conteúdo de uma tarefa na proposta; o item de lista arrastável fica em _semana.html. #}
<span class="tarefa-semana__titulo">{{ item.tarefa.titulo }}</span>
<span class="tarefa-semana__blocos">{{ item.blocos }} bloco{{ item.blocos|pluralize }}</span>
<details class="tarefa-semana__mover">
  <summary>Mover</summary>
  <form method="post" action="{% url 'web:mover_na_semana' %}" hx-post="{% url 'web:mover_na_semana' %}" hx-target="#semana" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="hidden" name="tarefa" value="{{ item.tarefa.pk }}">
    <input type="hidden" name="de" value="{{ de }}">
    <input type="hidden" name="data" value="{{ referencia }}">
    <input type="hidden" name="visao" value="{{ visao }}">
    <label class="visualmente-oculto" for="para-{{ item.tarefa.pk }}-{{ de|default:'fora' }}">Mover “{{ item.tarefa.titulo }}” para</label>
    <select id="para-{{ item.tarefa.pk }}-{{ de|default:'fora' }}" name="para">
      {% for d in proposta.dias %}{% if d.iso != de %}<option value="{{ d.iso }}">{{ d.nome }} {{ d.dia|date:"j" }}</option>{% endif %}{% endfor %}
      {% if de %}<option value="">Não couberam</option>{% endif %}
    </select>
    <button class="botao botao--pequeno" type="submit">Mover</button>
  </form>
</details>
