{# Conteúdo de uma rotina no dia (fixa, não arrasta); o item de lista fica em _semana.html. #}
<span class="rotina-semana__hora">{% if r.horario %}{{ r.horario|time:"H:i" }}{% else %}Sem horário{% endif %}</span>
<span class="rotina-semana__titulo"><svg class="rotina-semana__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>{{ r.rotina.nome }}</span>
<span class="rotina-semana__meta">Rotina · {{ r.rotina.duracao_min }} min{% if r.concluida %} · feita{% endif %}</span>
