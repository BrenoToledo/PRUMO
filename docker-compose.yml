services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prumo
      POSTGRES_PASSWORD: prumo
      POSTGRES_DB: prumo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prumo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
